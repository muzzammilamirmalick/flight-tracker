name: CI

on:
  push:
  pull_request:

jobs:
  api:
    name: API build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore FlightTracker.slnx

      - name: Build
        run: dotnet build FlightTracker.slnx --no-restore --configuration Release

      # Endpoint tests use an in-memory SQLite database, so no PostgreSQL is needed here.
      - name: Test
        run: dotnet test FlightTracker.slnx --no-build --configuration Release

  web:
    name: Web build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
